services:
  backend:
    build: ./backend
    volumes:
      - ./data:/app/data
      - ./backend/models.yaml:/app/models.yaml:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen(urllib.request.Request('http://127.0.0.1:8000/api/health', method='POST'))"]
      interval: 5s
      timeout: 3s
      retries: 15
    restart: unless-stopped
  frontend:
    build: ./frontend
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
